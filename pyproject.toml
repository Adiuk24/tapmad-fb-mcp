[project]
name = "tapmad-fb-mcp"
version = "1.0.0"
description = "Tapmad social MCP server: Meta Ads, Facebook Page and Instagram monitoring for Claude Code"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Tapmad" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.6.0,<2",
    "requests>=2.32.3",
]

[project.scripts]
tapmad-fb-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "daily_report.py"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"daily_report.py" = "daily_report.py"
